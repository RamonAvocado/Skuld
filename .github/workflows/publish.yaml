name: Publish Docker image

on:
  release:
    types: [published]
  # README-only edits update the Docker Hub page without a release
  push:
    branches: [main]
    paths: [docker/README.md]

permissions:
  contents: read

jobs:
  docker:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/skuld
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(jq -r .version package.json)" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "skip $IMAGE:$version (already on Docker Hub)"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.published != 'true'
        with:
          context: .
          file: docker/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

  readme:
    needs: docker
    # Still runs on README-only pushes, where the docker job is skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # The token needs the "Read, Write, Delete" scope to edit the description
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/skuld
          readme-filepath: docker/README.md
          short-description: Self-hosted dashboard for test plans, coverage and performance
